<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#e8f4f8"/>
  <rect x="50" y="50" width="500" height="350" fill="#f5f5f5" stroke="#2D2D2D" stroke-width="2" rx="8"/>

  <!-- 30km radius circles -->
  <circle cx="300" cy="225" r="180" fill="none" stroke="#E31837" stroke-width="3" stroke-dasharray="10,5" opacity="0.7"/>
  <circle cx="300" cy="225" r="120" fill="none" stroke="#E31837" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>
  <circle cx="300" cy="225" r="60" fill="none" stroke="#E31837" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>

  <!-- Center point -->
  <circle cx="300" cy="225" r="12" fill="#E31837"/>
  <circle cx="300" cy="225" r="6" fill="white"/>

  <!-- Labels -->
  <text x="300" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D2D2D">MILNERTON</text>
  <text x="300" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#E31837">30km Service Radius</text>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D2D2D">Murtons Projects Service Coverage</text>

  <!-- Coverage note -->
  <text x="300" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Northern Suburbs • Atlantic Seaboard • Southern Suburbs • West Coast</text>
</svg>